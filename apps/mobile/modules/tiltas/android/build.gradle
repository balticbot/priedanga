plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.balticbot.priedanga'
version = '0.1.0'

android {
  namespace "com.balticbot.priedanga.tiltas"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // org.json on the plain JVM (Android's copy is a stub in unit tests)
  testImplementation 'org.json:json:20240303'
}
